name: SpO2 ODI verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python
        run: python -m compileall -q spo2_odi.py cli.py agents enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Verify browser logic
        run: node --test web/app.test.js
      - name: Docker build
        if: matrix.python-version == '3.12'
        run: docker build -t spo2-odi-test .
